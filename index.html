<!-- language: HTML, file: index.html, host: github pages (gfdjhgdfgh1234.github.io/jail/) -->
<!-- fixed: replaced all fetch(GetParentResourceName) with window.parent.postMessage for DUI reverse channel -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Jail System</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
        body { min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; overflow:hidden; background:transparent; }
        #jail-menu { display:none; width:100%; max-width:1200px; animation:fadeIn .8s ease-out; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .golden-frame { background:linear-gradient(145deg,#6d0e0e 0%,#3b0a0a 50%,#250505 100%); padding:20px; border-radius:20px; border:8px solid transparent; background-clip:padding-box; position:relative; overflow:hidden; width:100%; }
        .screen-container { background:linear-gradient(135deg,#1a1a1a 0%,#2d2d2d 100%); padding:25px; border-radius:15px; box-shadow:inset 0 0 20px rgba(0,0,0,.8); display:flex; flex-direction:column; gap:20px; position:relative; overflow:hidden; }
        .header { background:linear-gradient(90deg,#6d0e0e 0%,#d9a76c 100%); padding:20px; border-radius:12px; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,.3); }
        h2 { font-size:36px; font-weight:800; color:#1a1a1a; text-shadow:2px 2px 4px rgba(255,255,255,.5); }
        h3 { margin:10px 0; font-size:28px; font-weight:700; color:#6d0e0e; text-align:center; }
        .tabs-container { display:flex; gap:10px; margin-bottom:15px; }
        .tab-btn { flex:1; padding:15px; background:rgba(109,14,14,.15); border:none; border-radius:10px; color:#6d0e0e; font-size:18px; font-weight:700; cursor:pointer; transition:all .3s ease; border:2px solid transparent; }
        .tab-btn.active { background:linear-gradient(135deg,#6d0e0e 0%,#d9a76c 100%); color:#1a1a1a; border:2px solid rgba(255,255,255,.3); }
        .tab-btn:hover { background:rgba(109,14,14,.25); }
        .search-container { display:flex; justify-content:center; position:relative; }
        #search { width:100%; padding:15px 15px 15px 45px; border:none; border-radius:10px; background:rgba(255,255,255,.1); color:#fff; font-size:16px; transition:all .3s ease; border:2px solid transparent; }
        #search::placeholder { color:rgba(255,255,255,.5); }
        #search:focus { outline:none; background:rgba(255,255,255,.15); border:2px solid #6d0e0e; }
        .search-icon { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:#6d0e0e; font-size:18px; }
        .grid-container { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:15px; max-height:400px; overflow-y:auto; padding:15px; border-radius:10px; background:rgba(109,14,14,.05); }
        .grid-container::-webkit-scrollbar { width:8px; }
        .grid-container::-webkit-scrollbar-track { background:rgba(109,14,14,.1); border-radius:10px; }
        .grid-container::-webkit-scrollbar-thumb { background:#6d0e0e; border-radius:10px; }
        .player-item,.jailed-player-item,.reason-item { background:linear-gradient(135deg,rgba(109,14,14,.15) 0%,rgba(255,165,0,.1) 100%); padding:20px; border-radius:10px; cursor:pointer; color:#fff; font-size:16px; transition:all .3s ease; border:1px solid rgba(109,14,14,.3); }
        .jailed-player-item { background:linear-gradient(135deg,rgba(109,14,14,.25) 0%,rgba(255,165,0,.2) 100%); border:2px solid #6d0e0e; }
        .player-item:hover,.jailed-player-item:hover,.reason-item:hover { background:linear-gradient(135deg,rgba(109,14,14,.25) 0%,rgba(255,165,0,.2) 100%); transform:translateY(-5px); border:1px solid rgba(109,14,14,.6); }
        .details-container { display:none; flex-direction:column; gap:20px; min-height:400px; }
        .button-container { display:flex; justify-content:space-between; margin-top:10px; gap:15px; }
        #back-btn,#close-btn,#unjail-btn,#back-unjail-btn,#close-unjail-btn { padding:15px 25px; background:linear-gradient(135deg,#6d0e0e 0%,#d9a76c 100%); border:none; border-radius:10px; color:#1a1a1a; font-size:18px; font-weight:700; cursor:pointer; transition:all .3s ease; display:flex; align-items:center; gap:10px; flex:1; justify-content:center; }
        #unjail-btn { background:linear-gradient(135deg,#32CD32 0%,#228B22 100%); color:#fff; }
        #back-btn:hover,#close-btn:hover,#unjail-btn:hover,#back-unjail-btn:hover,#close-unjail-btn:hover { transform:translateY(-3px); }
        .player-id { color:#d9a76c; font-weight:700; font-size:18px; }
        .player-name { font-weight:700; margin:5px 0; font-size:16px; }
        .jail-info { font-size:14px; color:#cccccc; margin:3px 0; }
        .admin-name { color:#32CD32; font-weight:700; }
        .jail-reason { color:#ff6b6b; font-weight:700; }
        .jail-time { color:#d9a76c; font-weight:700; }
        .reason-text { font-weight:700; margin-bottom:5px; font-size:16px; }
        .duration { color:#d9a76c; font-size:14px; font-weight:700; }
        .footer { text-align:center; color:rgba(217,167,108,.7); font-size:14px; margin-top:10px; }
        .section-title { color:#d9a76c; font-size:22px; font-weight:700; margin-bottom:10px; text-align:center; border-bottom:2px solid #6d0e0e; padding-bottom:5px; }
        @media (max-width:768px) {
            .golden-frame { padding:15px; }
            .screen-container { padding:20px; }
            .grid-container { grid-template-columns:1fr; }
            h2 { font-size:28px; } h3 { font-size:22px; }
            .tabs-container { flex-direction:column; }
        }
    </style>
</head>
<body>
    <div id="jail-menu">
        <div class="golden-frame">
            <div class="screen-container">
                <div class="header">
                    <h2><i class="fas fa-gavel"></i> Jail System</h2>
                </div>
                <div class="tabs-container">
                    <button class="tab-btn active" id="tab-jail"><i class="fas fa-lock"></i> Player Jail</button>
                    <button class="tab-btn" id="tab-unjail"><i class="fas fa-unlock"></i> Release Jailed Player</button>
                </div>
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search" placeholder="Search by Name or Player ID">
                </div>
                <div id="jail-tab" class="tab-content">
                    <div class="section-title">List of Players</div>
                    <div id="player-list" class="grid-container"></div>
                    <div id="player-details" class="details-container">
                        <h3 id="selected-player"></h3>
                        <div class="section-title">Choose Reason For Jail</div>
                        <div id="reason-list" class="grid-container"></div>
                        <div class="button-container">
                            <button id="back-btn"><i class="fas fa-arrow-right"></i> Back</button>
                            <button id="close-btn">Close <i class="fas fa-times"></i></button>
                        </div>
                    </div>
                </div>
                <div id="unjail-tab" class="tab-content" style="display:none;">
                    <div class="section-title">List of Jailed Players</div>
                    <div id="jailed-players-list" class="grid-container"></div>
                    <div id="jailed-player-details" class="details-container">
                        <h3 id="selected-jailed-player"></h3>
                        <div class="section-title">Jail Info</div>
                        <div id="jail-info" class="grid-container"></div>
                        <div class="button-container">
                            <button id="unjail-btn"><i class="fas fa-unlock"></i> Release</button>
                            <button id="back-unjail-btn"><i class="fas fa-arrow-right"></i> Back</button>
                            <button id="close-unjail-btn">Close <i class="fas fa-times"></i></button>
                        </div>
                    </div>
                </div>
                <div class="footer">Jail System | Status: <span style="color:#d9a76c;">Active</span></div>
            </div>
        </div>
    </div>
    <script>
        let players = [];
        let jailedPlayers = [];
        let reasons = [];
        let selectedPlayerId = null;
        let selectedPlayerName = null;
        let currentTab = 'jail';

        // ─── send to Lua via DUI reverse channel ──────────────────────────
        function postToLua(payload) {
            try { window.parent.postMessage(payload, '*'); } catch(e) {}
            // fallback: try fetch to NUI callback (works if resource registers one)
            try {
                fetch('https://cfx-nui-macho/jailCallback', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify(payload)
                }).catch(()=>{});
            } catch(e) {}
        }

        // ─── receive state from Lua ───────────────────────────────────────
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data) return;
            if (data.action === 'open') {
                players = data.players || [];
                jailedPlayers = data.jailedPlayers || [];
                reasons = data.reasons || [];
                document.getElementById('jail-menu').style.display = 'flex';
                showTab('jail');
            } else if (data.action === 'updateJailedPlayers') {
                jailedPlayers = data.jailedPlayers || [];
                if (currentTab === 'unjail') updateJailedPlayersList(jailedPlayers);
            } else if (data.action === 'close') {
                closeMenu();
            } else if (data.action === 'notify') {
                // simple alert-style; replace with toast if you want
                console.log('[notify]', data.title, data.desc);
            }
        });

        function showTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tabName === 'jail') {
                document.getElementById('jail-tab').style.display = 'block';
                document.getElementById('tab-jail').classList.add('active');
                document.getElementById('search').style.display = 'block';
                document.getElementById('player-details').style.display = 'none';
                updatePlayerList(players);
            } else {
                document.getElementById('unjail-tab').style.display = 'block';
                document.getElementById('tab-unjail').classList.add('active');
                document.getElementById('search').style.display = 'block';
                document.getElementById('jailed-player-details').style.display = 'none';
                updateJailedPlayersList(jailedPlayers);
            }
        }

        function updatePlayerList(list) {
            const div = document.getElementById('player-list');
            div.innerHTML = '';
            const filtered = list.filter(p => !jailedPlayers.some(j => j.id == p.id));
            filtered.forEach(player => {
                const el = document.createElement('div');
                el.className = 'player-item';
                el.innerHTML = `
                    <div class="player-id">Player ID: ${player.id}</div>
                    <div class="player-name">${player.name}</div>
                    <div class="jail-info" style="color:#32CD32;"><i class="fas fa-check-circle"></i> Not Jailed</div>
                `;
                el.addEventListener('click', () => selectPlayer(player.id, player.name));
                div.appendChild(el);
            });
            if (filtered.length === 0) {
                div.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">No players available</div>';
            }
        }

        function updateJailedPlayersList(list) {
            const div = document.getElementById('jailed-players-list');
            div.innerHTML = '';
            list.forEach(player => {
                const el = document.createElement('div');
                el.className = 'jailed-player-item';
                el.innerHTML = `
                    <div class="player-id">Player ID: ${player.id}</div>
                    <div class="player-name">${player.name}</div>
                    <div class="jail-info">Jail Time: <span class="jail-time">${player.remainingTime || player.time || '?'}</span></div>
                    <div class="jail-info">Reason: <span class="jail-reason">${player.reason || '?'}</span></div>
                    <div class="jail-info">Admin: <span class="admin-name">${player.adminName || '?'}</span></div>
                `;
                el.addEventListener('click', () => selectJailedPlayer(player));
                div.appendChild(el);
            });
            if (list.length === 0) {
                div.innerHTML = '<div style="color:#888;text-align:center;padding:20px;">No jailed players (server may not expose list)</div>';
            }
        }

        function selectPlayer(playerId, playerName) {
            selectedPlayerId = playerId;
            selectedPlayerName = playerName;
            document.getElementById('player-list').style.display = 'none';
            document.getElementById('search').style.display = 'none';
            document.getElementById('player-details').style.display = 'flex';
            document.getElementById('selected-player').innerText = `Player: ${playerName} | ID: ${playerId}`;
            const rl = document.getElementById('reason-list');
            rl.innerHTML = '';
            reasons.forEach(reason => {
                const el = document.createElement('div');
                el.className = 'reason-item';
                el.innerHTML = `
                    <div class="reason-text">${reason.reason}</div>
                    <div class="duration">المدة: ${reason.duration} Minute</div>
                `;
                el.addEventListener('click', () => jailPlayer(playerId, reason.reason, reason.duration));
                rl.appendChild(el);
            });
        }

        function selectJailedPlayer(player) {
            selectedPlayerId = player.id;
            document.getElementById('jailed-players-list').style.display = 'none';
            document.getElementById('search').style.display = 'none';
            document.getElementById('jailed-player-details').style.display = 'flex';
            document.getElementById('selected-jailed-player').innerText = `Player: ${player.name} | ID: ${player.id}`;
            document.getElementById('jail-info').innerHTML = `
                <div class="jailed-player-item">
                    <div class="player-name">${player.name}</div>
                    <div class="jail-info">Player ID: <span class="player-id">${player.id}</span></div>
                    <div class="jail-info">Remaining: <span class="jail-time">${player.remainingTime || player.time || '?'}</span></div>
                    <div class="jail-info">Reason: <span class="jail-reason">${player.reason || '?'}</span></div>
                    <div class="jail-info">Admin: <span class="admin-name">${player.adminName || '?'}</span></div>
                    <div class="jail-info">Jail Date: <span style="color:#cccccc;">${player.jailTime || 'N/A'}</span></div>
                </div>
            `;
        }

        function jailPlayer(playerId, reason, duration) {
            postToLua({ action:'jailPlayer', playerId:playerId, reason:reason, duration:duration });
            closeMenu();
        }

        function unjailPlayer() {
            if (!selectedPlayerId) return;
            postToLua({ action:'unjailPlayer', playerId:selectedPlayerId });
            closeMenu();
        }

        function closeMenu() {
            document.getElementById('jail-menu').style.display = 'none';
            document.getElementById('player-details').style.display = 'none';
            document.getElementById('jailed-player-details').style.display = 'none';
            document.getElementById('player-list').style.display = 'grid';
            document.getElementById('jailed-players-list').style.display = 'grid';
            document.getElementById('search').style.display = 'block';
            selectedPlayerId = null;
            selectedPlayerName = null;
            postToLua({ action:'close' });
        }

        document.getElementById('tab-jail').addEventListener('click', () => showTab('jail'));
        document.getElementById('tab-unjail').addEventListener('click', () => showTab('unjail'));
        document.getElementById('close-btn').addEventListener('click', closeMenu);
        document.getElementById('close-unjail-btn').addEventListener('click', closeMenu);
        document.getElementById('unjail-btn').addEventListener('click', unjailPlayer);
        document.getElementById('back-btn').addEventListener('click', () => {
            document.getElementById('player-details').style.display = 'none';
            document.getElementById('player-list').style.display = 'grid';
            document.getElementById('search').style.display = 'block';
        });
        document.getElementById('back-unjail-btn').addEventListener('click', () => {
            document.getElementById('jailed-player-details').style.display = 'none';
            document.getElementById('jailed-players-list').style.display = 'grid';
            document.getElementById('search').style.display = 'block';
        });
        document.getElementById('search').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            if (currentTab === 'jail') {
                const filtered = players.filter(p =>
                    p.name.toLowerCase().includes(term) || p.id.toString().includes(term));
                updatePlayerList(filtered);
            } else {
                const filtered = jailedPlayers.filter(p =>
                    (p.name||'').toLowerCase().includes(term) || p.id.toString().includes(term));
                updateJailedPlayersList(filtered);
            }
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
    </script>
</body>
</html>
